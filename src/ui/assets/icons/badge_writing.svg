<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="nibMetallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="30%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="nibGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="inkDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <filter id="nibShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Pen Nib Shadow Base -->
  <path d="M32 56 L18 28 C16 22 18 12 18 6 L46 6 C46 12 48 22 46 28 Z" fill="#0f172a" transform="translate(0, 3)"/>

  <!-- Pen Collar / Barrel Mount -->
  <rect x="20" y="4" width="24" height="6" rx="2" fill="url(#nibGold)" stroke="#92400e" stroke-width="1.2"/>

  <!-- Main Fountain Pen Nib Body (3D Metallic) -->
  <path d="M32 55 L19 28 C17 22 20 10 20 10 L44 10 C44 10 47 22 45 28 Z"
        fill="url(#nibMetallic)" stroke="#334155" stroke-width="1.6" filter="url(#nibShadow)"/>

  <!-- Gold Inlay / Wings Detail -->
  <path d="M32 46 L24 28 C23 24 24 16 24 14 L40 14 C40 16 41 24 40 28 Z"
        fill="url(#nibGold)" stroke="#b45309" stroke-width="1" opacity="0.9"/>

  <!-- Precision Ink Slit & Breather Hole -->
  <circle cx="32" cy="30" r="3" fill="#0f172a"/>
  <line x1="32" y1="33" x2="32" y2="55" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Blade Specular Highlight -->
  <path d="M32 53 L21 28 C19 22 22 12 22 12 L28 12 C28 16 26 24 32 30 Z" fill="#ffffff" opacity="0.35"/>

  <!-- Dynamic Ink Droplet at Nib Tip -->
  <g transform="translate(32, 59)">
    <path d="M0 -3 C-3 2, -4 4, -4 6 C-4 8.5, -2.2 10.5, 0 10.5 C2.2 10.5, 4 8.5, 4 6 C4 4, 3 2, 0 -3 Z" fill="url(#inkDrop)"/>
    <ellipse cx="-1.2" cy="5.5" rx="1.2" ry="1.8" fill="#ffffff" opacity="0.75"/>
  </g>
</svg>
