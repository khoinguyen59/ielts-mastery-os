<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cardGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cardGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <filter id="badgeShadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#082f49" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Back Card (Rotated slightly left) -->
  <g transform="rotate(-10 28 32)">
    <rect x="14" y="14" width="30" height="38" rx="6" fill="#082f49" transform="translate(0, 3)"/>
    <rect x="14" y="14" width="30" height="38" rx="6" fill="url(#cardGradBack)" stroke="#0284c7" stroke-width="1.5"/>
    <line x1="20" y1="22" x2="38" y2="22" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <line x1="20" y1="28" x2="34" y2="28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Front Card (3D Embossed with Letter 'A') -->
  <g transform="rotate(6 36 34)" filter="url(#badgeShadow3d)">
    <!-- 3D Bottom Edge -->
    <rect x="20" y="14" width="32" height="40" rx="6" fill="#0c4a6e" transform="translate(0, 3)"/>
    <!-- Card Face -->
    <rect x="20" y="14" width="32" height="40" rx="6" fill="url(#cardGradFront)" stroke="#7dd3fc" stroke-width="1.8"/>

    <!-- Subtle Grid / Vocabulary Lines -->
    <line x1="26" y1="44" x2="46" y2="44" stroke="#e0f2fe" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <line x1="28" y1="48" x2="44" y2="48" stroke="#bae6fd" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Academic Letter 'A' Embossed -->
    <path d="M36 21 L42 37 L38.5 37 L37.2 33 L34.8 33 L33.5 37 L30 37 Z M36 25 L35.2 30.5 L36.8 30.5 Z"
          fill="#ffffff" stroke="#0284c7" stroke-width="0.8"/>

    <!-- Specular Highlight Top-Left -->
    <path d="M22 17 L48 17 C49 17, 50 18, 50 19 L22 25 Z" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
