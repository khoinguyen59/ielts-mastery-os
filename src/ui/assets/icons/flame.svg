  <!-- Mid Flame Tongue -->
  <path d="M32 18 C35 24 40 29 44 33 C48 37 49 42 49 47 C49 55 42 58 32 58 C22 58 15 55 15 47 C15 39 19 33 24 28 C25 32 27 35 29 36 C29 28 30 22 32 18 Z"
