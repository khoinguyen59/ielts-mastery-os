  <path d="M32 4 C35 12 40 18 47 23 C53 27 57 34 57 43 C57 55 46 61 32 61 C18 61 7 55 7 43 C7 33 12 25 18 19 C19 25 22 29 25 31 C25 21 28 11 32 4 Z"
