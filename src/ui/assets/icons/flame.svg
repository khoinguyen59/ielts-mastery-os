      <stop offset="60%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="flameShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#7f1d1d" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 3D Base Shadow / Depth Rim -->
  <path d="M32 4 C35 12 40 18 47 23 C53 27 57 34 57 43 C57 55 46 62 32 62 C18 62 7 55 7 43 C7 33 12 25 18 19 C19 25 22 29 25 31 C25 21 28 11 32 4 Z"
