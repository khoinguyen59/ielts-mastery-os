  <!-- Inner Hot White-Yellow Core -->
  <path d="M32 30 C34 35 38 39 40 43 C41 46 41 49 41 52 C41 56 37 57 32 57 C27 57 23 56 23 52 C23 47 25 43 28 39 C29 41 30 43 31 44 C31 38 32 34 32 30 Z"
