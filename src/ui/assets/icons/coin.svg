<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="coinGoldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="coinFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="coinEmboss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="coin3dShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#78350f" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 3D Beveled Base Depth -->
  <circle cx="32" cy="34" r="28" fill="#78350f"/>

  <!-- Outer Beveled Golden Rim -->
  <circle cx="32" cy="32" r="28" fill="url(#coinGoldRim)" filter="url(#coin3dShadow)"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#fef08a" stroke-width="1.2" opacity="0.85"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="#92400e" stroke-width="1.2"/>

  <!-- Recessed Coin Face -->
  <circle cx="32" cy="32" r="22.5" fill="url(#coinFace)"/>

  <!-- Decorative Beaded / Star Border on Rim -->
  <circle cx="13" cy="32" r="1.5" fill="#fef08a"/>
  <circle cx="51" cy="32" r="1.5" fill="#fef08a"/>
  <circle cx="32" cy="13" r="1.5" fill="#fef08a"/>
  <circle cx="32" cy="51" r="1.5" fill="#fef08a"/>

  <!-- Embossed Scholar Mortarboard Relief in Center -->
  <g transform="translate(32, 32)">
    <!-- Emboss Shadow Under Mortarboard -->
    <polygon points="0,-10 16,-4 0,3 -16,-4" fill="#78350f" transform="translate(0, 1.5)"/>
    <!-- Mortarboard Diamond Top -->
    <polygon points="0,-10 16,-4 0,3 -16,-4" fill="url(#coinEmboss)" stroke="#92400e" stroke-width="0.8"/>
    <!-- Skull Cap Beneath -->
    <path d="M-8 0 C-8 6, 8 6, 8 0" fill="#92400e"/>
    <path d="M-7 0 C-7 5, 7 5, 7 0" fill="url(#coinEmboss)"/>
    <!-- Button & Tassel -->
    <circle cx="0" cy="-4" r="1.8" fill="#fef08a" stroke="#78350f" stroke-width="0.6"/>
    <path d="M0 -4 C-5 -4, -9 0, -11 5" fill="none" stroke="#fef08a" stroke-width="1.4" stroke-linecap="round"/>
    <circle cx="-11" cy="6" r="1.2" fill="#fef08a"/>
  </g>

  <!-- 3D Specular Arc Reflection -->
  <path d="M12 24 A24 24 0 0 1 32 8" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
</svg>
