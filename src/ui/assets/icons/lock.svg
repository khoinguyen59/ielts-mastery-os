<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shackleMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#f8fafc"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="lockBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="40%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="lockGoldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="lock3dShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#020617" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 3D Shackle (Hardened Steel Loop) -->
  <path d="M22 28 L22 18 C22 11 26 6 32 6 C38 6 42 11 42 18 L42 28"
        fill="none" stroke="url(#shackleMetal)" stroke-width="7" stroke-linecap="round"/>
  <path d="M22 28 L22 18 C22 11 26 6 32 6 C38 6 42 11 42 18 L42 28"
        fill="none" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Shackle Specular Highlight -->
  <path d="M24 18 C24 13 27 9 32 9" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>

  <!-- Lock Body 3D Base Shadow -->
  <rect x="14" y="26" width="36" height="30" rx="8" fill="#020617" transform="translate(0, 3)"/>

  <!-- Padlock Chunky Main Body -->
  <rect x="14" y="25" width="36" height="30" rx="8" fill="url(#lockBodyGrad)" stroke="#475569" stroke-width="2" filter="url(#lock3dShadow)"/>

  <!-- Inner Bevel Rim -->
  <rect x="17" y="28" width="30" height="24" rx="5" fill="none" stroke="#64748b" stroke-width="1.2" opacity="0.6"/>

  <!-- Keyhole (Brass/Gold Inlay) -->
  <g transform="translate(32, 40)">
    <circle cx="0" cy="0" r="4.5" fill="#020617"/>
    <polygon points="-2.5,0 2.5,0 3.5,7 -3.5,7" fill="#020617"/>
    <circle cx="0" cy="-0.5" r="2.5" fill="url(#lockGoldBevel)"/>
    <polygon points="-1,-0.5 1,-0.5 1.5,5 -1.5,5" fill="url(#lockGoldBevel)"/>
    <!-- Deep Slot -->
    <circle cx="0" cy="-0.5" r="1.2" fill="#020617"/>
    <line x1="0" y1="0.5" x2="0" y2="4" stroke="#020617" stroke-width="1.2"/>
  </g>

  <!-- Specular Sheen Across Top Edge of Padlock Body -->
  <path d="M18 27 L46 27" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
