<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="heartRuby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="35%" stop-color="#f43f5e"/>
      <stop offset="75%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="heartBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="heartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#4c0519" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- 3D Bottom Depth Shadow -->
  <path d="M32 58 C29 55, 6 36, 6 22 C6 13, 14 6, 23 6 C27 6, 30 8, 32 11 C34 8, 37 6, 41 6 C50 6, 58 13, 58 22 C58 36, 35 55, 32 58 Z"
        fill="#4c0519" transform="translate(0, 3)"/>

  <!-- Main 3D Heart Body -->
  <path d="M32 57 C29 54, 6 35, 6 21 C6 12, 14 5, 23 5 C27 5, 30 7, 32 10 C34 7, 37 5, 41 5 C50 5, 58 12, 58 21 C58 35, 35 54, 32 57 Z"
        fill="url(#heartRuby)" filter="url(#heartShadow)"/>

  <!-- Inner Soft Top Bevel Rim -->
  <path d="M32 55 C29 52, 8 34, 8 21 C8 13, 15 7, 23 7 C26 7, 29 9, 32 12 C35 9, 38 7, 41 7 C49 7, 56 13, 56 21 C56 34, 35 52, 32 55 Z"
        fill="none" stroke="url(#heartBevel)" stroke-width="1.5" opacity="0.6"/>

  <!-- Left Lobe Glossy Curved Glass Bubble Highlight -->
  <ellipse cx="20" cy="17" rx="8" ry="5.5" transform="rotate(-32, 20, 17)" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="19" cy="16" rx="4.5" ry="2.5" transform="rotate(-32, 19, 16)" fill="#ffffff" opacity="0.9"/>

  <!-- Right Lobe Secondary Sheen Dot -->
  <circle cx="45" cy="15" r="3" fill="#ffffff" opacity="0.45"/>
  <circle cx="45" cy="15" r="1.5" fill="#ffffff" opacity="0.8"/>
</svg>
