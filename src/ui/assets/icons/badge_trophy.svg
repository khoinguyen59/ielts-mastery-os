<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="trophyBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="trophyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#78350f" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- 3D Pedestal Base -->
  <g id="pedestal">
    <rect x="20" y="52" width="24" height="6" rx="2" fill="#0f172a" transform="translate(0, 2)"/>
    <rect x="20" y="52" width="24" height="6" rx="2" fill="url(#trophyBase)" stroke="#475569" stroke-width="1.2"/>
    <rect x="23" y="47" width="18" height="6" rx="1.5" fill="url(#trophyGold)" stroke="#92400e" stroke-width="1"/>
    <!-- Gold Plaque on Base -->
    <rect x="25" y="54" width="14" height="2.5" rx="1" fill="#fef08a"/>
  </g>

  <!-- Trophy Handles (Ear Rings) -->
  <!-- Left Handle -->
  <path d="M22 18 C12 18, 10 32, 22 36" fill="none" stroke="url(#trophyGold)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M22 18 C12 18, 10 32, 22 36" fill="none" stroke="#78350f" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right Handle -->
  <path d="M42 18 C52 18, 54 32, 42 36" fill="none" stroke="url(#trophyGold)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M42 18 C52 18, 54 32, 42 36" fill="none" stroke="#78350f" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Trophy Cup Body (3D Gold) -->
  <g filter="url(#trophyShadow)">
    <path d="M20 10 L44 10 C44 26, 38 38, 32 42 C26 38, 20 26, 20 10 Z"
          fill="url(#trophyGold)" stroke="#b45309" stroke-width="1.5"/>
    <!-- Cup Rim Oval Top -->
    <ellipse cx="32" cy="10" rx="12" ry="3.5" fill="#fef08a" stroke="#b45309" stroke-width="1.2"/>
    <ellipse cx="32" cy="10" rx="9" ry="2" fill="#f59e0b"/>
  </g>

  <!-- Stem Between Cup & Base -->
  <rect x="30" y="42" width="4" height="6" rx="1" fill="url(#trophyGold)" stroke="#b45309" stroke-width="1"/>

  <!-- Academic Star & Laurel Relief on Cup -->
  <polygon points="32,20 33.5,24 38,24 34.5,27 36,31 32,28.5 28,31 29.5,27 26,24 30.5,24" fill="#ffffff" stroke="#92400e" stroke-width="0.6"/>

  <!-- Specular Curve Highlight on Left Edge of Cup -->
  <path d="M22 13 C22 24, 25 32, 29 37" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
</svg>
