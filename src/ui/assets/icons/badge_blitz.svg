<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blitzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blitzGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="blitzShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#b45309" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Circular Electric Background Energy Halo -->
  <circle cx="32" cy="32" r="28" fill="#1e1b4b" opacity="0.3"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="url(#blitzGlow)" stroke-width="2" stroke-dasharray="8 4" opacity="0.75"/>

  <!-- Small Sparks / Energy Flares -->
  <polygon points="12,24 14,29 19,30 15,33 16,38 12,35 8,37 10,32 6,29 11,28" fill="#38bdf8" opacity="0.85" transform="scale(0.6) translate(12, 10)"/>
  <polygon points="52,14 53,18 57,19 54,22 55,26 51,23 48,25 49,21 46,18 50,18" fill="#fde047" opacity="0.9" transform="scale(0.5) translate(50, 8)"/>

  <!-- 3D Beveled Lightning Depth Shadow -->
  <polygon points="36,4 16,34 32,34 26,60 48,26 33,26" fill="#78350f" transform="translate(0, 3)"/>

  <!-- Main 3D Beveled Thunderbolt -->
  <polygon points="36,4 16,34 32,34 26,60 48,26 33,26" fill="url(#blitzGrad)" stroke="#fef08a" stroke-width="1.8" filter="url(#blitzShadow)"/>

  <!-- Left Facet Highlight (Gloss) -->
  <polygon points="36,4 16,34 32,34 31,31 22,31 34,9" fill="#ffffff" opacity="0.55"/>

  <!-- Center Ridge Line -->
  <line x1="33" y1="12" x2="28" y2="34" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="32" y1="34" x2="33" y2="50" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
</svg>
